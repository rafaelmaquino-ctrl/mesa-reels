name: Render Reel

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag da release que receberá o MP4 (ex: reel-20261008)"
        required: true
      props:
        description: "JSON com foto (URL), hook, steps e closing"
        required: true

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Dependências do Chrome headless
        run: |
          sudo apt-get update
          sudo apt-get install -y libnss3 libdbus-1-3 libatk1.0-0 libasound2t64 libxrandr2 libxkbcommon-dev libxfixes3 libxcomposite1 libxdamage1 libgbm-dev libcups2 libatk-bridge2.0-0
      - run: npm ci
      - name: Renderizar
        env:
          PROPS: ${{ inputs.props }}
        run: |
          printf '%s' "$PROPS" > props.json
          npx remotion render src/index.ts Dica out/reel.mp4 --props=props.json --log=error
      - name: Publicar MP4 na release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: gh release create "$TAG" out/reel.mp4 --title "$TAG" --notes "Render automático"
